<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>QQ 授权结果 - 好朋友联机工具</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
      body { align-items: center; background: #f7f9fc; color: #1f2937; display: flex; justify-content: center; margin: 0; min-height: 100vh; }
      main { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 12px 32px rgb(15 23 42 / 8%); box-sizing: border-box; max-width: 440px; padding: 40px 32px; text-align: center; width: calc(100% - 32px); }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { color: #4b5563; line-height: 1.7; margin: 0; }
      a { color: #2563eb; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">正在处理 QQ 授权</h1>
      <p id="message">请稍候…</p>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const error = params.get('error');
      const code = params.get('code');

      if (error) {
        title.textContent = 'QQ 授权未完成';
        message.textContent = '授权已取消或未能完成，请返回首页后重试。';
      } else if (code) {
        title.textContent = 'QQ 授权成功';
        message.innerHTML = '已收到授权结果，正在返回首页…<br><a href="/">立即返回首页</a>';
        window.setTimeout(() => window.location.replace('/'), 1500);
      } else {
        title.textContent = '无效的 QQ 授权请求';
        message.innerHTML = '请从好朋友联机工具官网重新发起登录。<br><a href="/">返回首页</a>';
      }
    </script>
  </body>
</html>
